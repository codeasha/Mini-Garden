
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mini Garden</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  width: 100%;
  height: 100vh;
  height: 100dvh;
  overflow: hidden;
}

.garden {
  position: relative;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: linear-gradient(
    to bottom,
    #74c7ee 0%,
    #c6ebf1 48%,
    #b6dca0 48%,
    #568b45 100%
  );
}

/* SUN */

.sun {
  position: absolute;
  top: 9%;
  right: 13%;
  width: clamp(55px, 9vw, 105px);
  aspect-ratio: 1;
  border-radius: 50%;
  background: #fff2a6;
  box-shadow: 0 0 65px 20px #fff0a677;
  animation: glow 4s ease-in-out infinite alternate;
}

@keyframes glow {
  to {
    box-shadow: 0 0 100px 30px #fff0a699;
  }
}

/* CLOUDS */

.cloud {
  position: absolute;
  top: 19%;
  left: 10%;
  width: 110px;
  height: 30px;
  background: #fff;
  border-radius: 40px;
  opacity: .9;
  animation: clouds 22s ease-in-out infinite alternate;
}

.cloud::before,
.cloud::after {
  content: "";
  position: absolute;
  bottom: 8px;
  border-radius: 50%;
  background: inherit;
}

.cloud::before {
  left: 17px;
  width: 43px;
  height: 43px;
}

.cloud::after {
  right: 15px;
  width: 55px;
  height: 55px;
}

.cloud.two {
  top: 29%;
  left: 53%;
  transform: scale(.7);
  animation-delay: -9s;
}

@keyframes clouds {
  to { margin-left: 45px; }
}

/* DISTANT HILLS */

.hill {
  position: absolute;
  bottom: 37%;
  width: 75%;
  height: 25%;
  border-radius: 50% 50% 0 0;
  background: #8ecb89;
}

.hill.left {
  left: -28%;
}

.hill.right {
  right: -28%;
  height: 31%;
  background: #77b775;
}

/* GROUND */

.ground {
  position: absolute;
  bottom: 0;
  width: 100%;
  height: 43%;
  background:
    radial-gradient(ellipse at 20% 35%, #b2d778 0 2px, transparent 3px),
    radial-gradient(ellipse at 80% 65%, #9bc967 0 2px, transparent 3px),
    linear-gradient(to bottom, #77b84c, #315f35);
  background-size: 32px 35px, 39px 42px, auto;
}

/* CURVED STONE PATH */

.path {
  position: absolute;
  bottom: -35%;
  left: 35%;
  width: 35%;
  height: 70%;
  border-radius: 50% 50% 0 0;
  transform: rotate(-7deg);
  background: linear-gradient(
    90deg,
    #9b8969,
    #d8c6a0 45%,
    #c5af86 65%,
    #948365
  );
  box-shadow: inset 9px 0 15px #6b604455;
}

/* FENCE */

.fence {
  position: absolute;
  left: 3%;
  bottom: 34%;
  width: 94%;
  height: 17%;
  display: flex;
  justify-content: space-around;
  align-items: stretch;
}

.rail {
  position: absolute;
  z-index: 2;
  left: 0;
  width: 100%;
  height: 11px;
  border-radius: 3px;
  background: linear-gradient(#e6c69b, #a5794b);
  box-shadow: 0 3px 5px #263f2344;
}

.rail.top { top: 36%; }
.rail.bottom { top: 72%; }

.picket {
  position: relative;
  width: 6%;
  height: 100%;
  border-radius: 3px 3px 0 0;
  background: linear-gradient(
    90deg, #9e7047, #e2c398 48%, #a8794d
  );
  clip-path: polygon(0 13%, 50% 0, 100% 13%, 100% 100%, 0 100%);
}

/* FLOWER BED */

.flower-bed {
  position: absolute;
  bottom: 0;
  width: 100%;
  height: 38%;
  background: linear-gradient(
    to bottom,
    transparent,
    #386b35aa
  );
  pointer-events: none;
}

/* FLOWERS */

.flower {
  position: absolute;
  bottom: 5%;
  width: 70px;
  height: 190px;
  transform-origin: bottom center;
  animation: sway 3.5s ease-in-out infinite alternate;
}

@keyframes sway {
  from { rotate: -4deg; }
  to { rotate: 4deg; }
}

.stem {
  position: absolute;
  left: 33px;
  bottom: 0;
  width: 6px;
  height: 125px;
  border-radius: 10px;
  background: linear-gradient(to right, #28703c, #67ad51);
}

.leaf {
  position: absolute;
  width: 35px;
  height: 19px;
  border-radius: 100% 0 100% 0;
  background: linear-gradient(135deg, #8acb54, #27723b);
}

.leaf.left {
  left: 4px;
  bottom: 55px;
  transform: rotate(12deg);
}

.leaf.right {
  left: 34px;
  bottom: 80px;
  transform: scaleX(-1) rotate(12deg);
}

/* LARGE, VISIBLE FLOWER HEAD */

.bloom {
  position: absolute;
  left: 9px;
  top: 5px;
  width: 54px;
  height: 54px;
  animation: flower-sway 3s ease-in-out infinite alternate;
}

.petal {
  position: absolute;
  left: 17px;
  top: 0;
  width: 20px;
  height: 29px;
  border-radius: 50% 50% 45% 45%;
  background: var(--petal);
  transform-origin: 10px 27px;
  box-shadow: inset -3px -2px 4px #00000014;
}

.petal:nth-child(1) { transform: rotate(0deg); }
.petal:nth-child(2) { transform: rotate(45deg); }
.petal:nth-child(3) { transform: rotate(90deg); }
.petal:nth-child(4) { transform: rotate(135deg); }
.petal:nth-child(5) { transform: rotate(180deg); }
.petal:nth-child(6) { transform: rotate(225deg); }
.petal:nth-child(7) { transform: rotate(270deg); }
.petal:nth-child(8) { transform: rotate(315deg); }

.center {
  position: absolute;
  z-index: 2;
  left: 19px;
  top: 19px;
  width: 17px;
  height: 17px;
  border-radius: 50%;
  background: radial-gradient(circle at 35% 30%, #fff18a, #e9a51f 75%);
  box-shadow: 0 1px 3px #78501a66;
}

@keyframes flower-sway {
  from { transform: rotate(-3deg); }
  to { transform: rotate(3deg); }
}

/* FLOWER POSITIONS */

.f1 {
  left: 5%;
  bottom: 4%;
  --petal: #ff7198;
}

.f2 {
  left: 19%;
  bottom: 2%;
  transform: scale(.78);
  --petal: #fff5df;
  animation-delay: -.8s;
}

.f3 {
  left: 33%;
  bottom: 5%;
  transform: scale(1.08);
  --petal: #d6a0ff;
  animation-delay: -1.1s;
}

.f4 {
  right: 30%;
  bottom: 2%;
  transform: scale(.82);
  --petal: #ffdc58;
  animation-delay: -.5s;
}

.f5 {
  right: 16%;
  bottom: 5%;
  transform: scale(1.08);
  --petal: #ff8790;
  animation-delay: -1.4s;
}

.f6 {
  right: 3%;
  bottom: 3%;
  transform: scale(.9);
  --petal: #fff2ec;
  animation-delay: -.7s;
}

/* BUTTERFLY */

.butterfly {
  position: absolute;
  top: 39%;
  left: 40%;
  font-size: 28px;
  animation: flutter 7s ease-in-out infinite;
}

@keyframes flutter {
  0%   { transform: translate(0, 0) rotate(-15deg); }
  25%  { transform: translate(60px, -35px) rotate(15deg); }
  50%  { transform: translate(130px, 5px) rotate(-10deg); }
  75%  { transform: translate(70px, 35px) rotate(15deg); }
  100% { transform: translate(0, 0) rotate(-15deg); }
}

/* GRASS BLADES */

.blades {
  position: absolute;
  bottom: 0;
  width: 100%;
  height: 12%;
  background: linear-gradient(transparent, #285a32a8);
}

@media (max-width: 500px) {
  .flower {
    transform: scale(.68);
    transform-origin: bottom center;
  }

  .f1 { left: -1%; }
  .f2 { left: 13%; }
  .f3 { left: 28%; }
  .f4 { right: 25%; }
  .f5 { right: 10%; }
  .f6 { right: -4%; }

  .fence {
    left: 0;
    width: 100%;
  }

  .path {
    left: 30%;
    width: 45%;
  }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation: none !important;
  }
}
</style>
</head>

<body>
<div class="garden">

  <div class="sun"></div>
  <div class="cloud"></div>
  <div class="cloud two"></div>

  <div class="hill left"></div>
  <div class="hill right"></div>
  <div class="ground"></div>
  <div class="path"></div>

  <div class="fence">
    <div class="rail top"></div>
    <div class="rail bottom"></div>
    <div class="picket"></div>
    <div class="picket"></div>
    <div class="picket"></div>
    <div class="picket"></div>
    <div class="picket"></div>
    <div class="picket"></div>
    <div class="picket"></div>
    <div class="picket"></div>
    <div class="picket"></div>
    <div class="picket"></div>
    <div class="picket"></div>
    <div class="picket"></div>
    <div class="picket"></div>
  </div>

  <div class="flower-bed"></div>

  <div class="flower f1">
    <div class="stem"></div>
    <div class="leaf left"></div>
    <div class="leaf right"></div>
    <div class="bloom">
      <i class="petal"></i><i class="petal"></i>
      <i class="petal"></i><i class="petal"></i>
      <i class="petal"></i><i class="petal"></i>
      <i class="petal"></i><i class="petal"></i>
      <i class="center"></i>
    </div>
  </div>

  <div class="flower f2">
    <div class="stem"></div>
    <div class="leaf left"></div>
    <div class="leaf right"></div>
    <div class="bloom">
      <i class="petal"></i><i class="petal"></i>
      <i class="petal"></i><i class="petal"></i>
      <i class="petal"></i><i class="petal"></i>
      <i class="petal"></i><i class="petal"></i>
      <i class="center"></i>
    </div>
  </div>

  <div class="flower f3">
    <div class="stem"></div>
    <div class="leaf left"></div>
    <div class="leaf right"></div>
    <div class="bloom">
      <i class="petal"></i><i class="petal"></i>
      <i class="petal"></i><i class="petal"></i>
      <i class="petal"></i><i class="petal"></i>
      <i class="petal"></i><i class="petal"></i>
      <i class="center"></i>
    </div>
  </div>

  <div class="flower f4">
    <div class="stem"></div>
    <div class="leaf left"></div>
    <div class="leaf right"></div>
    <div class="bloom">
      <i class="petal"></i><i class="petal"></i>
      <i class="petal"></i><i class="petal"></i>
      <i class="petal"></i><i class="petal"></i>
      <i class="petal"></i><i class="petal"></i>
      <i class="center"></i>
    </div>
  </div>

  <div class="flower f5">
    <div class="stem"></div>
    <div class="leaf left"></div>
    <div class="leaf right"></div>
    <div class="bloom">
      <i class="petal"></i><i class="petal"></i>
      <i class="petal"></i><i class="petal"></i>
      <i class="petal"></i><i class="petal"></i>
      <i class="petal"></i><i class="petal"></i>
      <i class="center"></i>
    </div>
  </div>

  <div class="flower f6">
    <div class="stem"></div>
    <div class="leaf left"></div>
    <div class="leaf right"></div>
    <div class="bloom">
      <i class="petal"></i><i class="petal"></i>
      <i class="petal"></i><i class="petal"></i>
      <i class="petal"></i><i class="petal"></i>
      <i class="petal"></i><i class="petal"></i>
      <i class="center"></i>
    </div>
  </div>

  <div class="butterfly">🦋</div>
  <div class="blades"></div>

</div>
</body>
</html>
